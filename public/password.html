<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>パスワード変更 | Upcoming Conferences</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="inner">
      <a class="brand" href="/">
        <span class="logo">UC</span>
        Upcoming Conferences
      </a>
      <nav class="nav" id="nav-auth"></nav>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title">パスワード変更</h1>

    <form id="change-password-form" class="panel">
      <div class="form-grid">
        <div class="form-field full">
          <label for="currentPassword">現在のパスワード</label>
          <input id="currentPassword" name="currentPassword" type="password" required />
        </div>
        <div class="form-field full">
          <label for="newPassword">新しいパスワード</label>
          <input id="newPassword" name="newPassword" type="password" required minlength="6" />
        </div>
        <div class="form-field full">
          <label for="newPasswordConfirm">新しいパスワード（確認）</label>
          <input id="newPasswordConfirm" name="newPasswordConfirm" type="password" required minlength="6" />
        </div>
      </div>
      <p class="form-error" id="form-error"></p>
      <p class="form-success" id="form-success"></p>
      <div class="form-actions">
        <button type="submit" class="btn">変更</button>
        <a class="btn btn-secondary" href="/">キャンセル</a>
      </div>
    </form>
  </main>

  <footer class="site-footer">Upcoming Conferences — 学会締め切り管理</footer>

  <script src="/js/api.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/auth-pages.js"></script>
</body>
</html>
